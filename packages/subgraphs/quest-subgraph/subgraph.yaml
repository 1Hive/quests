specVersion: 0.0.5
schema:
  file: ./src/schema.graphql
templates:
  - name: QuestDetailMetadata
    kind: file/ipfs
    mapping:
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/quest-factory.ts
      handler: handleQuestMetadata
      entities:
        - QuestMetadata
      abis:
        - name: QuestFactory
          file: ./abis/QuestFactory.proxy.json
dataSources:
  - kind: ethereum/contract
    name: QuestFactory
    network: gnosis
    source:
      address: "0x5Be5286FEFE6a44f394b551B6AC9255D42e974fe"
      abi: QuestFactory
      startBlock: 22777803
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - QuestCreated
      abis:
        - name: QuestFactory
          file: ./abis/QuestFactory.json
      eventHandlers:
        - event: QuestCreated(address,string,bytes,address,uint256,address,address,uint256,address)
          handler: handleQuestCreated
        - event: DepositChanged(uint256,address,uint256)
          handler: handleDepositChanged
      file: ./src/mappings/quest-factory.ts
  - kind: ethereum/contract
    name: QuestFactory-Quest
    network: gnosis
    source:
      abi: Quest
      startBlock: 22777803
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - QuestClaimed
      abis:
        - name: Quest
          file: ./abis/Quest.json
      eventHandlers:
        - event: QuestClaimed(bytes,address,uint256)
          handler: handleQuestClaimed
      file: ./src/mappings/quest-factory.ts
  - kind: ethereum/contract
    name: QuestFactoryV2
    network: gnosis
    source:
      address: "0x2fc3f4A630cD6962A22033436Fd63D93B180c076"
      abi: QuestFactory
      startBlock: 25750107
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - QuestCreatedV2
      abis:
        - name: QuestFactory
          file: ./abis/QuestFactory.2.json
      eventHandlers:
        - event: QuestCreated(address,string,bytes,address,uint256,address,address,uint256,address,uint256,address,uint32)
          handler: handleQuestCreated
        - event: CreateDepositChanged(uint256,address,uint256)
          handler: handleCreateDepositChanged
        - event: PlayDepositChanged(uint256,address,uint256)
          handler: handlePlayDepositChanged
      file: ./src/mappings/quest-factory.2.ts
  - kind: ethereum/contract
    name: QuestFactoryV2-Quest
    network: gnosis
    source:
      abi: Quest
      startBlock: 25750107
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - QuestClaimedV2
        - QuestPlayed
        - QuestUnplayed
      abis:
        - name: Quest
          file: ./abis/Quest.2.json
      eventHandlers:
        - event: QuestClaimed(bytes,address,uint256)
          handler: handleQuestClaimed
        - event: QuestPlayed(address,uint256)
          handler: handleQuestPlayed
        - event: QuestUnplayed(address,uint256)
          handler: handleQuestUnplayed
      file: ./src/mappings/quest-factory.2.ts
